<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Predict Sentiment</title>
    <style>
        /* Smooth fade-in animation for the body */
        body {
            background: #000428;
            background: linear-gradient(to right, #050708, #000428);
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: #ffffff;
            animation: fadeIn 1.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Container with smooth pop-in effect */
        .container {
            background: rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(255, 255, 255, 0.2);
            width: 400px;
            text-align: center;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            animation: popIn 1s ease-out;
        }

        @keyframes popIn {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            margin-bottom: 15px;
            font-size: 2em;
            color: #d57e22;
            text-shadow: 0 0 15px rgba(22, 20, 17, 0.8);
            animation: glowText 2s infinite alternate;
        }

        @keyframes glowText {
            from { text-shadow: 0 0 10px #0d0c0a; }
            to { text-shadow: 0 0 20px #12100d; }
        }

        /* Stylish input area */
        textarea {
            width: 90%;
            padding: 10px;
            background-color: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            color: #ffffff;
            font-size: 1em;
            resize: none;
            outline: none;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        textarea:focus {
            border-color: #c17a0f;
            box-shadow: 0 0 10px #dea02e;
        }

        /* Glowing button effect */
        .btn {
            background: linear-gradient(90deg, #ce8b19, #f29421);
            border: none;
            padding: 12px 25px;
            font-size: 1.1em;
            border-radius: 8px;
            color: #ffffff;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(227, 162, 12, 0.6);
            animation: pulseBlue 1.5s infinite;
            transition: transform 0.3s;
        }

        @keyframes pulseBlue {
            0% { box-shadow: 0 0 10px rgba(15, 1, 7, 0.6); }
            50% { box-shadow: 0 0 20px rgba(11, 15, 16, 0.9); }
            100% { box-shadow: 0 0 10px rgba(17, 21, 23, 0.6); }
        }

        .btn:hover {
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Footer */
        .footer {
            margin-top: 15px;
            font-size: 0.85em;
            color: #d7781a;
            animation: fadeInFooter 1.5s ease-in-out;
        }

        @keyframes fadeInFooter {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sentiment Prediction</h1>
        <form action="/predict" method="POST">
            <textarea name="message" placeholder="Enter your message..." required></textarea>
            <br><br>
            <button type="submit" class="btn">Know Sentiment</button>
        </form>
        <div class="footer">
            <p>Powered by Your Sentiment Analysis Model</p>
        </div>
    </div>
</body>
</html>
