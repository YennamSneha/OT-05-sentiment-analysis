<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Airline Sentiment Analysis</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        .navbar {
            background-color: #1f1f1f;
            padding: 15px;
        }
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 80vh;
        }
        #predict-btn {
            background-color: #ff9800;
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s ease;
        }
        #predict-btn:hover {
            background-color: #e68900;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h2>Airline Sentiment </h2>
    </nav>
    <div class="container">
        <h1>Welcome to Airline Sentiment Analysis</h1>
        <button id="predict-btn">Predict Sentiment</button>
    </div>
    <script src="script.js"></script>
</body>
</html>
